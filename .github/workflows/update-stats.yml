name: Generate Stats Image
on:
  schedule:
    - cron: "0 0 * * *"  # una volta al giorno
  workflow_dispatch:      # permette di lanciarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: jstrieb/github-stats@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
